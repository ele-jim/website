<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ensure proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="index/pictures/icons/ELE_Logo.webp">
    <link rel="stylesheet" href="index/shared.css" />
    <style>
      /* ─── ADDITIONAL ERROR PAGE STYLES ────────────────────────────────────────── */
      .error {
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      
      .error h1 {
        font-family: 'SF Mono', monospace;
        font-weight: 600;
        font-size: 6rem;
        padding-top: 10vh;
        margin: 0;
        color: black;
      }
      
      .error p {
        color: black;
      }
      
      .error p.page-not-found {
        font-size: 1.3rem;
      }
      
      .error p.subscribe-message {
        font-size: 1.1rem;
        font-style: italic;
        padding-top: 15px;
      }
      
      .error p.emoji-sad,
      .error p.emoji-hand {
        font-size: 3rem;
        margin: 0;
      }
      
      .error p.emoji-hand {
        padding-bottom: 10vh;
        line-height: 0.5;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="Return homepage">
        <img src="index/pictures/icons/ELE_Logo.webp" class="logo" alt="Eight Limb Entertainment Logo" width="150" height="150" decoding="async" />
      </a>
      <div class="social-media-icons desktop">
        <a
          href="https://www.instagram.com/eightlimbentertainment"
          target="_blank"
          rel="noopener"
          aria-label="Instagram"
        >
          <img src="index/pictures/icons/instagram.webp" alt="Instagram" width="40" height="40" loading="lazy" decoding="async" />
        </a>
        <a
          href="https://www.facebook.com/8Limbent/"
          target="_blank"
          rel="noopener"
          aria-label="Facebook"
        >
          <img src="index/pictures/icons/facebook.webp" alt="Facebook" width="40" height="40" loading="lazy" decoding="async" />
        </a>
        <a href="mailto:8limbent@gmail.com" aria-label="Email">
          <img src="index/pictures/icons/email.webp" alt="Email" width="40" height="40" loading="lazy" decoding="async" />
        </a>
      </div>
    </header>
    
    <main>
      <section class="error">
        <h1>404</h1>
        <p class="page-not-found">Page not found</p>
        <p class="subscribe-message">
          while you're here...<br />
          subscribe to our newsletter?
        </p>
        <p class="emoji-sad">🥺</p>
        <p class="emoji-hand">👉👈</p>
      </section>
      
    </main>
    
    <footer>
        <!-- Decorative Wave using the .top-header-wave class from vinyls.css -->
      <img
        src="index/pictures/svg/layered-waves-top.svg"
        alt="Top Decorative Wave"
        class="top-header-wave"
     />
      <div class="footer-content">
        <h2>STAY IN TOUCH</h2>
        <p>Subscribe to our newsletter</p>
        <div id="mc_embed_shell">
          <div id="mc_embed_signup">
            <form
              action="https://eightlimbentertainment.us18.list-manage.com/subscribe/post?u=9b61f0337e598c65b4f6a818e&amp;id=00c6726dcd&amp;f_id=00839ee6f0"
              method="post"
              id="mc-embedded-subscribe-form"
              name="mc-embedded-subscribe-form"
              class="validate"
              target="_self"
              novalidate
            >
              <div id="mc_embed_signup_scroll">
                <div class="indicates-required">
                  <span class="asterisk"></span>
                </div>
                <div class="mc-field-group">
                  <label for="mce-EMAIL">
                    <span class="asterisk"></span>
                  </label>
                  <button class="invisible-button" aria-hidden="true"></button>
                  <input
                    type="email"
                    name="EMAIL"
                    class="required email"
                    id="mce-EMAIL"
                    required
                    value=""
                    placeholder="your@email.com"
                  />
                  <button
                    type="submit"
                    name="subscribe"
                    id="mc-embedded-subscribe"
                    class="button"
                  >
                    <img
                      src="index/pictures/icons/enter-subscribe.webp"
                      alt="Subscribe"
                    />
                  </button>
                </div>
                <div id="mce-responses" class="clear foot">
                  <div
                    class="response"
                    id="mce-error-response"
                    style="display: none"
                  ></div>
                  <div
                    class="response"
                    id="mce-success-response"
                    style="display: none"
                  ></div>
                </div>
                <div style="position: absolute; left: -5000px" aria-hidden="true">
                  <input
                    type="text"
                    name="b_9b61f0337e598c65b4f6a818e_00c6726dcd"
                    tabindex="-1"
                    value=""
                  />
                </div>
              </div>
            </form>
          </div>
        </div>
        <!-- Mobile Social Media Icons -->
        <div class="social-media-icons mobile">
          <a
            href="https://www.instagram.com/eightlimbentertainment"
            target="_blank"
          rel="noopener"
            aria-label="Instagram"
          >
            <img src="index/pictures/icons/instagram.webp" alt="Instagram" />
          </a>
          <a
            href="https://www.facebook.com/8Limbent/"
            target="_blank"
          rel="noopener"
            aria-label="Facebook"
          >
            <img src="index/pictures/icons/facebook.webp" alt="Facebook" />
          </a>
          <a href="mailto:8limbent@gmail.com" aria-label="Email">
            <img src="index/pictures/icons/email.webp" alt="Email" />
          </a>
        </div>
        <p class="copyright">&copy; 2019 Eight Limb Entertainment</p>
      </div>
    </footer>
    
    <!-- JavaScript -->
    <script src="index/js/emailValidation.js"></script>
</body>
</html>
